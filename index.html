<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dayflow HRMS</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.app{display:flex;min-height:100vh}.sidebar{width:250px;background:#111827;color:#fff;padding:22px 16px;position:fixed;inset:0 auto 0 0}
.logo{font-size:24px;font-weight:800;margin-bottom:6px}.tag{font-size:12px;color:#9ca3af;margin-bottom:28px}
.nav button{display:block;width:100%;text-align:left;background:transparent;color:#cbd5e1;padding:12px 14px;border-radius:10px;margin:5px 0}
.nav button:hover,.nav button.active{background:#2563eb;color:#fff}.main{margin-left:250px;width:calc(100% - 250px);padding:25px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:28px}.user{background:#fff;padding:10px 15px;border-radius:12px;box-shadow:0 2px 12px #0000000d}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 18px #0000000b}.metric{font-size:28px;font-weight:800;margin-top:7px}.muted{color:#6b7280;font-size:13px}.section{margin-top:20px}.section h2{font-size:19px}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:14px}.badge{padding:5px 9px;border-radius:20px;font-size:12px;font-weight:700;background:#e5e7eb}.green{background:#dcfce7;color:#166534}.yellow{background:#fef3c7;color:#92400e}.red{background:#fee2e2;color:#991b1b}.blue{background:#dbeafe;color:#1d4ed8}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form input,.form select,.form textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px}.form textarea{grid-column:1/-1;min-height:90px}.full{grid-column:1/-1}.primary{background:#2563eb;color:#fff;padding:11px 16px;border-radius:9px}.danger{background:#dc2626;color:#fff;padding:10px 14px;border-radius:9px}.secondary{background:#e5e7eb;color:#111827;padding:10px 14px;border-radius:9px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.chat{height:370px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;background:#f8fafc;padding:15px;border-radius:12px;margin-bottom:10px}.msg{padding:9px 12px;border-radius:12px;margin:7px 0;max-width:80%}.bot{background:#e0e7ff}.me{background:#dbeafe;margin-left:auto}.chatrow{display:flex;gap:8px}.chatrow input{flex:1;padding:11px;border:1px solid #d1d5db;border-radius:9px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#172554,#2563eb)}.loginbox{background:#fff;width:390px;padding:32px;border-radius:20px;box-shadow:0 20px 60px #0005}.loginbox h1{margin-top:0}.loginbox input,.loginbox select{width:100%;padding:12px;margin:7px 0;border:1px solid #d1d5db;border-radius:9px}.loginbox button{width:100%;margin-top:10px}.error{color:#dc2626;font-size:13px;margin-top:8px}
@media(max-width:900px){.sidebar{width:210px}.main{margin-left:210px;width:calc(100% - 210px)}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:650px){.sidebar{display:none}.main{margin-left:0;width:100%;padding:15px}.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const state={
 user:null, page:'dashboard',
 employees:[
  {id:'ADM001',name:'Dayflow Admin',email:'admin@dayflow.com',password:'admin123',role:'ADMIN',dept:'Human Resources',designation:'HR Manager',phone:'9876543210',address:'Bengaluru',salary:80000,allowance:10000,deduction:5000,leave:18,sick:8},
  {id:'EMP001',name:'Lavanya',email:'lavanya@dayflow.com',password:'emp123',role:'EMPLOYEE',dept:'Engineering',designation:'Software Engineer',phone:'9876543210',address:'Bengaluru',salary:50000,allowance:10000,deduction:5000,leave:18,sick:8},
  {id:'EMP002',name:'Anitha',email:'anitha@dayflow.com',password:'emp123',role:'EMPLOYEE',dept:'Finance',designation:'Finance Executive',phone:'',address:'',salary:45000,allowance:8000,deduction:4000,leave:18,sick:8}
 ],
 attendance:[], leaves:[], notifications:[]
};
const root=document.getElementById('root');
function fmt(n){return Number(n).toLocaleString('en-IN',{maximumFractionDigits:0})}
function emp(){return state.user}
function employee(id){return state.employees.find(x=>x.id===id)}
function notify(id,msg){state.notifications.push({id,msg,time:new Date().toLocaleString(),read:false})}
function nav(items){return items.map(x=>`<button class="${state.page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function layout(content){
 let admin=emp().role==='ADMIN';
 root.innerHTML=`<div class="app"><aside class="sidebar">
 <div class="logo">⚡ Dayflow</div><div class="tag">Human Resource Management System</div>
 <div class="nav">${admin?nav([['dashboard','📊 Command Center'],['employees','👥 Employees'],['attendance','📅 Attendance'],['leaves','🏖️ Leave Approval'],['payroll','💰 Payroll'],['wellbeing','❤️ Wellbeing'],['intelligence','🧠 Leave Intelligence'],['analytics','📈 Analytics'],['copilot','🤖 AI HR Copilot'],['notifications','🔔 Notifications']]):nav([['dashboard','🏠 Dashboard'],['profile','👤 My Profile'],['attendance','📅 Attendance'],['leaves','🏖️ My Leave'],['payroll','💰 Salary Slip'],['wellbeing','❤️ Wellbeing'],['intelligence','🧠 Leave Intelligence'],['copilot','🤖 AI Assistant'],['notifications','🔔 Notifications']])}
 <button onclick="logout()" style="margin-top:20px;color:#fca5a5">🚪 Logout</button></div></aside>
 <main class="main"><div class="top"><h1>${title()}</h1><div class="user">${emp().name} · <b>${emp().role}</b></div></div>${content}</main></div>`;
}
function title(){let m={dashboard:'HR Dashboard',employees:'Employee Management',attendance:'Smart Attendance',leaves:'Leave Management',payroll:'Payroll & Salary',wellbeing:'Employee Wellbeing Radar',intelligence:'Leave Intelligence',analytics:'Analytics & Reports',copilot:'AI HR Copilot',notifications:'Notifications',profile:'My Profile'};return m[state.page]||'Dayflow'}
function go(p){state.page=p;render()}
function render(){if(!state.user){login();return} let f={dashboard:dashboard,employees:employees,attendance:attendance,leaves:leaves,payroll:payroll,wellbeing:wellbeing,intelligence:intelligence,analytics:analytics,copilot:copilot,notifications:notifications,profile:profile};layout(f[state.page]())}
function login(){
 root.innerHTML=`<div class="login"><div class="loginbox"><h1>⚡ Dayflow</h1><p class="muted">Every workday, perfectly aligned.</p>
 <input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password">
 <button class="primary" onclick="doLogin()">Sign In</button><button class="secondary" onclick="signup()">Create Employee Account</button>
 <p class="muted">Demo Admin: admin@dayflow.com / admin123<br>Demo Employee: lavanya@dayflow.com / emp123</p><div id="err" class="error"></div></div></div>`;
}
function doLogin(){let e=state.employees.find(x=>x.email.toLowerCase()===document.getElementById('email').value.toLowerCase()&&x.password===document.getElementById('pass').value);if(!e){document.getElementById('err').textContent='Invalid email or password.';return}state.user=e;state.page='dashboard';notify(e.id,'Successful login recorded.');render()}
function signup(){let name=prompt('Full name:');if(!name)return;let email=prompt('Email:');if(!email)return;let pass=prompt('Password (minimum 6 characters):');if(!pass||pass.length<6){alert('Password must have at least 6 characters.');return}if(state.employees.some(x=>x.email.toLowerCase()===email.toLowerCase())){alert('Email already registered.');return}let id='EMP'+String(state.employees.length).padStart(3,'0');let e={id,name,email,password:pass,role:'EMPLOYEE',dept:'General',designation:'Employee',phone:'',address:'',salary:30000,allowance:5000,deduction:3000,leave:18,sick:8};state.employees.push(e);alert('Account created. You can now sign in.');}
function dashboard(){
 if(emp().role==='ADMIN'){
  let emps=state.employees.filter(x=>x.role==='EMPLOYEE'), today=state.attendance.filter(a=>a.date===new Date().toLocaleDateString());
  return `<div class="grid"><div class="card">👥<div class="muted">Employees</div><div class="metric">${emps.length}</div></div><div class="card">📅<div class="muted">Present Today</div><div class="metric">${today.filter(a=>a.status==='PRESENT').length}</div></div><div class="card">🏖️<div class="muted">Pending Leave</div><div class="metric">${state.leaves.filter(x=>x.status==='PENDING').length}</div></div><div class="card">💰<div class="muted">Monthly Payroll</div><div class="metric">₹${fmt(emps.reduce((s,x)=>s+x.salary+x.allowance-x.deduction,0))}</div></div></div>
  <div class="two section"><div class="card"><h2>Workforce Overview</h2>${emps.map(e=>`<p><b>${e.name}</b> · ${e.dept} <span class="badge ${wellScore(e)>2?'red':'green'}">${wellScore(e)>2?'Attention':'Healthy'}</span></p>`).join('')}</div><div class="card"><h2>Quick Actions</h2><div class="actions"><button class="primary" onclick="go('employees')">Manage Employees</button><button class="secondary" onclick="go('leaves')">Review Leaves</button><button class="secondary" onclick="go('analytics')">View Reports</button></div></div></div>`;
 }
 return `<div class="grid"><div class="card">👤<div class="muted">Profile</div><div class="metric">${emp().name}</div></div><div class="card">📅<div class="muted">Today</div><div class="metric">${todayStatus()}</div></div><div class="card">🏖️<div class="muted">Paid Leave</div><div class="metric">${emp().leave}</div></div><div class="card">💰<div class="muted">Net Salary</div><div class="metric">₹${fmt(emp().salary+emp().allowance-emp().deduction)}</div></div></div><div class="card section"><h2>Recent Alerts</h2><p>${state.notifications.filter(n=>n.id===emp().id).slice(-3).map(n=>n.msg).join('<br>')||'No new alerts.'}</p></div>`;
}
function todayStatus(){let a=state.attendance.find(x=>x.empId===emp().id&&x.date===new Date().toLocaleDateString());return a?a.status:'Not Checked In'}
function attendance(){
 if(emp().role==='ADMIN')return `<div class="card"><h2>All Attendance Records</h2>${state.attendance.length?`<table class="table"><tr><th>Employee</th><th>Date</th><th>Check In</th><th>Check Out</th><th>Hours</th><th>Status</th></tr>${state.attendance.map(a=>`<tr><td>${employee(a.empId).name}</td><td>${a.date}</td><td>${a.in}</td><td>${a.out||'-'}</td><td>${a.hours||0}</td><td><span class="badge blue">${a.status}</span></td></tr>`).join('')}</table>`:'No records yet.'}</div>`;
 let a=state.attendance.find(x=>x.empId===emp().id&&x.date===new Date().toLocaleDateString());
 return `<div class="grid"><div class="card"><div class="muted">Today's Status</div><div class="metric">${a?a.status:'Absent'}</div></div><div class="card"><div class="muted">Working Hours</div><div class="metric">${a?a.hours||0:0}</div></div><div class="card"><div class="muted">Check In</div><div class="metric" style="font-size:18px">${a?a.in:'-'}</div></div><div class="card"><div class="muted">Check Out</div><div class="metric" style="font-size:18px">${a?a.out||'-':'-'}</div></div></div><div class="card section"><div class="actions"><button class="primary" onclick="checkIn()">Check In</button><button class="secondary" onclick="checkOut()">Check Out</button></div><h2>Weekly Attendance</h2>${weeklyTable()}</div>`;
}
function checkIn(){if(state.attendance.some(a=>a.empId===emp().id&&a.date===new Date().toLocaleDateString()))return alert('Already checked in today.');state.attendance.push({empId:emp().id,date:new Date().toLocaleDateString(),in:new Date().toLocaleTimeString(),hours:0,status:'PRESENT'});notify(emp().id,'Smart check-in recorded.');render()}
function checkOut(){let a=state.attendance.find(x=>x.empId===emp().id&&x.date===new Date().toLocaleDateString());if(!a)return alert('Check in first.');if(a.out)return alert('Already checked out.');a.out=new Date().toLocaleTimeString();a.hours=8;notify(emp().id,'Check-out recorded.');render()}
function weeklyTable(){return `<table class="table"><tr><th>Date</th><th>Status</th><th>Hours</th></tr>${[...Array(7)].map((_,i)=>{let d=new Date(Date.now()-(6-i)*86400000).toLocaleDateString();let a=state.attendance.find(x=>x.empId===emp().id&&x.date===d);return `<tr><td>${d}</td><td>${a?a.status:'ABSENT / NO RECORD'}</td><td>${a?a.hours:0}</td></tr>`}).join('')}</table>`}
function employees(){return `<div class="card"><div class="actions"><button class="primary" onclick="addEmp()">+ Add Employee</button></div><table class="table"><tr><th>ID</th><th>Name</th><th>Department</th><th>Designation</th><th>Email</th><th>Salary</th><th>Action</th></tr>${state.employees.map(e=>`<tr><td>${e.id}</td><td>${e.name}</td><td>${e.dept}</td><td>${e.designation}</td><td>${e.email}</td><td>₹${fmt(e.salary)}</td><td><button class="secondary" onclick="viewEmp('${e.id}')">View</button></td></tr>`).join('')}</table></div>`}
function addEmp(){let name=prompt('Name:');if(!name)return;let email=prompt('Email:');let dept=prompt('Department:','Engineering');let designation=prompt('Designation:','Employee');let salary=Number(prompt('Basic salary:','30000'));let id='EMP'+String(state.employees.length).padStart(3,'0');state.employees.push({id,name,email,password:'welcome123',role:'EMPLOYEE',dept,designation,phone:'',address:'',salary,allowance:5000,deduction:2000,leave:18,sick:8});alert('Employee added. Temporary password: welcome123');render()}
function viewEmp(id){let e=employee(id);alert(`Employee Profile\n\nID: ${e.id}\nName: ${e.name}\nEmail: ${e.email}\nDepartment: ${e.dept}\nDesignation: ${e.designation}\nPhone: ${e.phone}\nAddress: ${e.address}\nSalary: ₹${fmt(e.salary)}\nPaid Leave: ${e.leave}\nSick Leave: ${e.sick}`)}
function profile(){let e=emp();return `<div class="card"><h2>Complete Employee Profile</h2><div class="form"><label>Name<input value="${e.name}" disabled></label><label>Email<input value="${e.email}" disabled></label><label>Employee ID<input value="${e.id}" disabled></label><label>Department<input value="${e.dept}" disabled></label><label>Designation<input value="${e.designation}" disabled></label><label>Phone<input id="phone" value="${e.phone}"></label><label class="full">Address<input id="address" value="${e.address}"></label><button class="primary full" onclick="saveProfile()">Save Profile</button></div></div>`}
function saveProfile(){emp().phone=document.getElementById('phone').value;emp().address=document.getElementById('address').value;notify(emp().id,'Profile updated successfully.');alert('Profile saved.');render()}
function leaves(){
 if(emp().role==='ADMIN')return `<div class="card"><h2>Pending Leave Requests</h2>${state.leaves.filter(x=>x.status==='PENDING').map(r=>`<div style="padding:14px;border-bottom:1px solid #eee"><b>${employee(r.empId).name}</b> · ${r.type} · ${r.start} to ${r.end}<br><span class="muted">${r.reason}</span><div class="actions" style="margin-top:8px"><button class="primary" onclick="processLeave(${r.id},'APPROVED')">Approve</button><button class="danger" onclick="processLeave(${r.id},'REJECTED')">Reject</button></div></div>`).join('')||'No pending requests.'}</div>`;
 return `<div class="two"><div class="card"><h2>Apply for Leave</h2><div class="form"><select id="ltype"><option>PAID</option><option>SICK</option><option>UNPAID</option></select><input id="start" type="date"><input id="end" type="date"><textarea id="reason" placeholder="Remarks"></textarea><button class="primary full" onclick="applyLeave()">Submit Request</button></div></div><div class="card"><h2>My Requests</h2>${state.leaves.filter(x=>x.empId===emp().id).map(r=>`<p>${r.type} · ${r.start} → ${r.end} <span class="badge ${r.status==='APPROVED'?'green':r.status==='REJECTED'?'red':'yellow'}">${r.status}</span></p>`).join('')||'No requests.'}</div></div>`}
function applyLeave(){let s=document.getElementById('start').value,e=document.getElementById('end').value;if(!s||!e)return alert('Select dates.');let id=Date.now();state.leaves.push({id,empId:emp().id,type:document.getElementById('ltype').value,start:s,end:e,reason:document.getElementById('reason').value,status:'PENDING'});notify(emp().id,'Leave request submitted for HR approval.');notify('ADM001',`New leave request from ${emp().name}.`);alert('Leave request submitted.');render()}
function processLeave(id,status){let r=state.leaves.find(x=>x.id===id);r.status=status;if(status==='APPROVED'){let e=employee(r.empId);if(r.type==='PAID')e.leave=Math.max(0,e.leave+days(r.start,r.end)*-1);if(r.type==='SICK')e.sick=Math.max(0,e.sick+days(r.start,r.end)*-1)}notify(r.empId,`Your leave request has been ${status.toLowerCase()}.`);render()}
function days(a,b){return Math.max(1,Math.round((new Date(b)-new Date(a))/86400000)+1)}
function payroll(){
 if(emp().role==='ADMIN')return `<div class="card"><h2>Payroll Control</h2><table class="table"><tr><th>Employee</th><th>Basic</th><th>Allowance</th><th>Deduction</th><th>Net</th><th>Action</th></tr>${state.employees.filter(e=>e.role==='EMPLOYEE').map(e=>`<tr><td>${e.name}</td><td>₹${fmt(e.salary)}</td><td>₹${fmt(e.allowance)}</td><td>₹${fmt(e.deduction)}</td><td><b>₹${fmt(e.salary+e.allowance-e.deduction)}</b></td><td><button class="secondary" onclick="salaryEdit('${e.id}')">Edit</button></td></tr>`).join('')}</table></div>`;
 let e=emp(),gross=e.salary+e.allowance,net=gross-e.deduction;return `<div class="card"><h2>Monthly Salary Slip · ${new Date().toLocaleString('en',{month:'long',year:'numeric'})}</h2><p><b>${e.name}</b> · ${e.id}</p><table class="table"><tr><td>Basic Salary</td><td>₹${fmt(e.salary)}</td></tr><tr><td>Allowance</td><td>₹${fmt(e.allowance)}</td></tr><tr><td>Gross Salary</td><td>₹${fmt(gross)}</td></tr><tr><td>Deduction</td><td>₹${fmt(e.deduction)}</td></tr><tr><th>NET SALARY</th><th>₹${fmt(net)}</th></tr></table><button class="primary" onclick="window.print()">Print / Save Salary Slip</button></div>`}
function salaryEdit(id){let e=employee(id);e.salary=Number(prompt('Basic salary:',e.salary));e.allowance=Number(prompt('Allowance:',e.allowance));e.deduction=Number(prompt('Deduction:',e.deduction));notify(id,'Salary structure updated by HR.');render()}
function wellScore(e){let late=state.attendance.filter(a=>a.empId===e.id&&a.in).length;return (e.leave<5?2:0)+(late>10?1:0)}
function wellbeing(){if(emp().role==='ADMIN')return `<div class="grid">${state.employees.filter(e=>e.role==='EMPLOYEE').map(e=>`<div class="card"><h2>${e.name}</h2><div class="metric">${wellScore(e)>2?'⚠️ Attention':'✅ Healthy'}</div><p class="muted">Leave balance: ${e.leave} · Attendance records: ${state.attendance.filter(a=>a.empId===e.id).length}</p><p>${wellScore(e)>2?'Recommend manager check-in and workload review.':'No significant work-pattern alert detected.'}</p></div>`).join('')}</div>`;return `<div class="card"><h2>❤️ Your Wellbeing Radar</h2><div class="metric">${wellScore(emp())>2?'⚠️ Attention Required':'✅ Normal'}</div><p>We monitor attendance patterns, leave utilization and work-pattern indicators.</p><p><b>Recommendation:</b> ${wellScore(emp())>2?'Consider discussing workload with your manager.':'Maintain healthy work and leave habits.'}</p></div>`}
function intelligence(){let e=emp(),req=state.leaves.filter(r=>r.empId===e.id),used=18-e.leave;return `<div class="grid"><div class="card"><div class="muted">Paid Leave Used</div><div class="metric">${used}</div></div><div class="card"><div class="muted">Remaining</div><div class="metric">${e.leave}</div></div><div class="card"><div class="muted">Requests</div><div class="metric">${req.length}</div></div><div class="card"><div class="muted">Team Availability</div><div class="metric">${teamAvailability()}%</div></div></div><div class="card section"><h2>🧠 Intelligence</h2><p>${used>=12?'High leave utilization detected. Monitor remaining balance.':used>=6?'Moderate leave utilization. Usage is within a normal range.':'Low leave utilization. Employee may be under-utilizing available leave.'}</p><p><b>Team recommendation:</b> ${teamAvailability()<60?'Review workload before approving additional leave.':'Team availability is healthy.'}</p></div>`}
function teamAvailability(){let total=state.employees.filter(e=>e.role==='EMPLOYEE').length;if(!total)return 100;let today=new Date().toISOString().slice(0,10);let on=state.leaves.filter(r=>r.status==='APPROVED'&&r.start<=today&&r.end>=today).length;return Math.round((total-on)/total*100)}
function analytics(){let emps=state.employees.filter(e=>e.role==='EMPLOYEE'),pending=state.leaves.filter(r=>r.status==='PENDING').length,approved=state.leaves.filter(r=>r.status==='APPROVED').length;let payroll=emps.reduce((s,e)=>s+e.salary+e.allowance-e.deduction,0);return `<div class="grid"><div class="card"><div class="muted">Employees</div><div class="metric">${emps.length}</div></div><div class="card"><div class="muted">Leave Requests</div><div class="metric">${state.leaves.length}</div></div><div class="card"><div class="muted">Approval Rate</div><div class="metric">${state.leaves.length?Math.round(approved/state.leaves.length*100):0}%</div></div><div class="card"><div class="muted">Monthly Payroll</div><div class="metric">₹${fmt(payroll)}</div></div></div><div class="two section"><div class="card"><h2>Department Report</h2>${[...new Set(emps.map(e=>e.dept))].map(d=>`<p><b>${d}</b> — ${emps.filter(e=>e.dept===d).length} employees</p>`).join('')}</div><div class="card"><h2>Leave Pipeline</h2><p>Pending: ${pending}</p><p>Approved: ${approved}</p><p>Rejected: ${state.leaves.filter(r=>r.status==='REJECTED').length}</p></div></div>`}
function copilot(){return `<div class="card chat"><div class="messages" id="messages"><div class="msg bot">Hello ${emp().name}! I am the Dayflow AI HR Copilot. Ask me about attendance, leave, salary, wellbeing, employees, approvals or reports.</div></div><div class="chatrow"><input id="q" placeholder="Ask HR anything..." onkeydown="if(event.key==='Enter')ask()"><button class="primary" onclick="ask()">Ask</button></div></div>`}
function ask(){let q=document.getElementById('q').value.trim();if(!q)return;let box=document.getElementById('messages');box.innerHTML+=`<div class="msg me">${q}</div>`;let x=q.toLowerCase(),ans;if(x.includes('attendance'))ans=`Your attendance status today is ${todayStatus()}.`;else if(x.includes('leave'))ans=`You have ${emp().leave} paid leave and ${emp().sick} sick leave remaining.`;else if(x.includes('salary')||x.includes('payroll'))ans=`Your estimated net monthly salary is ₹${fmt(emp().salary+emp().allowance-emp().deduction)}.`;else if(x.includes('wellbeing')||x.includes('stress')||x.includes('workload'))ans=wellScore(emp())>2?'Your work pattern needs attention. Consider a manager check-in.':'No significant wellbeing alert is detected.';else if(x.includes('employee')&&emp().role==='ADMIN')ans=`There are ${state.employees.filter(e=>e.role==='EMPLOYEE').length} employees in Dayflow.`;else if(x.includes('pending'))ans=`There are ${state.leaves.filter(r=>r.status==='PENDING').length} pending leave requests.`;else if(x.includes('report')||x.includes('dashboard'))ans='Open Analytics or the HR Command Center for workforce metrics and recommendations.';else ans='I can help with attendance, leave, salary, wellbeing, employees, approvals and reports.';box.innerHTML+=`<div class="msg bot">${ans}</div>`;box.scrollTop=box.scrollHeight;document.getElementById('q').value=''}
function notifications(){let ns=state.notifications.filter(n=>n.id===emp().id);return `<div class="card"><h2>🔔 Notifications</h2>${ns.length?ns.slice().reverse().map(n=>`<div style="padding:13px;border-bottom:1px solid #eee"><b>${n.msg}</b><div class="muted">${n.time}</div></div>`).join(''):'No notifications.'}</div>`}
function logout(){state.user=null;login()}
render();
</script>
</body>
</html>
